name: Quality & Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Production build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Save verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuits-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Pages is not enabled. In Settings > Pages, select GitHub Actions. Build artifact was saved but no site was published.'
          fi
      - name: Download verified site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: circuits-dist
          path: dist
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify published site is reachable
        if: steps.pages.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo '::error::Pages deployment returned an empty URL.'
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            site_html=$(curl --fail --silent --show-error --location --max-time 15 "$SITE_URL") || site_html=""
            if printf '%s' "$site_html" | grep -Fq '<title>Circuits'; then
              echo "Verified public Pages HTML at $SITE_URL"
              exit 0
            fi
            echo "Pages not yet ready (attempt ${attempt}/6)"
            sleep 5
          done
          echo "::error::Public Pages HTML was not reachable at $SITE_URL"
          exit 1
