name: Apply exact-base cancellation fix
on:
  pull_request:
    branches: [main]
    paths: [scripts/alpha11-cancel-fix.mjs]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/alpha11-pointer-input'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/alpha11-cancel-fix.mjs
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts docs/ALPHA11.md
          git commit -m 'fix(editor): clear undragged pin state on cancellation'
          git push origin HEAD:refs/heads/work/alpha11-pointer-input
